services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trian
      POSTGRES_DB: trian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trian -d trian"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Chỉ mở trong máy; bên ngoài vào qua Nginx (HTTPS) của server
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data:ro

volumes:
  pgdata:
